name: Deploy to All Servers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GOOGLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GOOGLE_SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.cursor' --exclude '.gitignore' \
            --exclude '/includes/DB_connect.php' \
            --exclude '/includes/config.local.php' \
            --exclude '/web/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.GOOGLE_SSH_USER }}@${{ secrets.GOOGLE_SSH_HOST }}:/var/www/herrajes-express/

  deploy-amazon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AMAZON_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.AMAZON_SSH_PORT }} -H ${{ secrets.AMAZON_SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.cursor' --exclude '.gitignore' \
            --exclude '/includes/DB_connect.php' \
            --exclude '/includes/config.local.php' \
            --exclude '/web/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.AMAZON_SSH_PORT }}" \
            ./ ${{ secrets.AMAZON_SSH_USER }}@${{ secrets.AMAZON_SSH_HOST }}:/var/www/herrajes-express.com/web/

  deploy-amazon-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Next standalone
        working-directory: web
        env:
          HE_CATALOGO_API_BASE: https://api-gs.sostenmutuo.com
          HE_SITE_URL: https://www.herrajes-express.com
        run: |
          npm ci
          npm run build
          cp -a .next/static .next/standalone/.next/static
          rm -rf .next/standalone/public .next/standalone/data
          cp -a public .next/standalone/public
          cp -a data .next/standalone/data
          cp -a ecosystem.config.cjs .next/standalone/ecosystem.config.cjs
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AMAZON_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.AMAZON_SSH_PORT }} -H ${{ secrets.AMAZON_SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Publish Next to Amazon
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.AMAZON_SSH_PORT }}" \
            web/.next/standalone/ \
            ${{ secrets.AMAZON_SSH_USER }}@${{ secrets.AMAZON_SSH_HOST }}:/var/www/herrajes-express-app/
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.AMAZON_SSH_PORT }} \
            ${{ secrets.AMAZON_SSH_USER }}@${{ secrets.AMAZON_SSH_HOST }} \
            'export PATH=/usr/local/bin:$PATH; cd /var/www/herrajes-express-app && pm2 startOrReload ecosystem.config.cjs --update-env'