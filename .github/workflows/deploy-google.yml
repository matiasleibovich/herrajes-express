name: Deploy to Google Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GOOGLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GOOGLE_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude '.gitignore' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.GOOGLE_SSH_USER }}@${{ secrets.GOOGLE_SSH_HOST }}:/var/www/herrajes-express/